<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Портал государственных закупок Нижегородской области</title>

    <!-- Montserrat font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="desktop">
      <!-- Фоновый блюр сверху -->
      <div class="top-blur" aria-hidden="true"></div>

      <header class="page-header">
        <div class="logo-container">
          <img
            class="logo-image"
            src="img/image-2.png"
            alt="Логотип"
          />
          <p class="logo-text">
            Портал государственных закупок<br />Нижегородской области
          </p>
        </div>

        <nav class="main-nav" aria-label="Основная навигация">
          <div class="nav-item active">
            <a href="#" class="nav-link">ИИ-Помощник</a>
            <div class="nav-indicator"></div>
          </div>
          <a href="instruction.html" class="nav-link">Инструкция</a>
        </nav>
      </header>

      <!-- Центральный контент -->
      <div class="content-center">
        <h1 class="page-title">Выберите модель</h1>

        <div class="cards-container">
          <a href="nmck.html" class="card-link">
            <article class="card-glass">
               <!-- Декоративные пятна фона карточки -->
              <div class="glass-bg-layer blur-blue"></div>
              <div class="glass-bg-layer circle-1"></div>
              <div class="glass-bg-layer circle-2"></div>
              <div class="glass-bg-layer circle-3"></div>
              <div class="glass-bg-layer circle-4"></div>

              <!-- Основное "стекло" -->
              <div class="glass-surface"></div>

              <!-- Контент карточки -->
              <div class="card-content">
                <h2 class="card-title">Формирование НМЦК</h2>
                <p class="card-description">
                  Формирование технического задания по характеристикам
                </p>
              </div>
            </article>
          </a>

          <a href="tz.html" class="card-link">
            <article class="card-glass">
               <!-- Декоративные пятна фона карточки -->
              <div class="glass-bg-layer blur-blue"></div>
              <div class="glass-bg-layer circle-1"></div>
              <div class="glass-bg-layer circle-2"></div>
              <div class="glass-bg-layer circle-3"></div>
              <div class="glass-bg-layer circle-4"></div>

              <!-- Основное "стекло" -->
              <div class="glass-surface"></div>

              <!-- Контент карточки -->
              <div class="card-content">
                <h2 class="card-title">Создание Технических заданий</h2>
                <p class="card-description">
                  Диалог с ИИ агентом для формирования ТЗ
                </p>
              </div>
            </article>
          </a>
        </div>
      </div>

      <!-- Декоративная башня справа внизу -->
      <img
        class="tower-decoration"
        src="img/1.png"
        alt=""
        aria-hidden="true"
      />
    </main>
  </body>
</html>
